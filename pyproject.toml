[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wanpire"
version = "0.0.1"
description = "A box on your Ethernet line that makes it behave like a long internet link"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyroute2>=0.9", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4", "httpx>=0.27"]
ui-test = ["playwright>=1.45"]

[project.scripts]
wanpire = "wanpire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wanpire = ["data/**/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/ui"]
markers = ["netns: needs root and Linux network namespaces"]
